name: Hero stats

on:
  workflow_dispatch:
  schedule:
    - cron: "37 6 * * *"
  push:
    branches:
      - main
    paths:
      - scripts/update_hero_stats.py
      - scripts/activity_graph.py
      - .github/workflows/hero-stats.yml

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Refresh numbers in hero.svg and README
        run: python3 scripts/update_hero_stats.py "${{ github.repository_owner }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Draw commit activity graph
        # Don't let a graph failure block saving the hero stats
        continue-on-error: true
        run: python3 scripts/activity_graph.py "${{ github.repository_owner }}"
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit & push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/hero.svg assets/hero-mobile.svg assets/activity-graph.svg assets/activity-graph-mobile.svg README.md
          git diff --cached --quiet && exit 0
          git commit -m "Update hero stats - [Skip GitHub Action]"
          # Other workflows push to main too; retry if we lose the race
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
