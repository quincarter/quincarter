name: Metrics
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"
  push:
    branches:
      - main

# METRICS_TOKEN: a personal access token (classic) with read:user and repo
# (or public_repo) scopes. The default GITHUB_TOKEN can only see this repo,
# so without it the cards report a single repository and its languages.
# Commits are still made with the workflow's own token.

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Overview card: header, activity, community, repos, languages
      - uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          config_display: columns
          config_timezone: America/New_York
