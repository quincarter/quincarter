name: Contribution graphs

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */12 * * *"
  push:
    branches:
      - main

jobs:
  # Snake animations, published to the `output` branch
  games:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#a78bfa&color_dots=#ebedf0,#c7e6ff,#7ddbff,#4fbcff,#a78bfa
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#fef3c7&color_dots=#0e1a30,#1a2a4a,#2f6fa8,#4fbcff,#a78bfa

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Isometric 3D contribution skyline, committed to profile-3d-contrib/
  skyline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          # Read-only PAT for full stats (see metrics.yml); falls back to the repo token
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A profile-3d-contrib
          git diff --cached --quiet && exit 0
          git commit -m "Update 3D contribution graph - [Skip GitHub Action]"
          # Other workflows push to main too; retry if we lose the race
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
