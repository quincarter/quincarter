name: Contribution graphs

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */12 * * *"
  push:
    branches:
      - main

jobs:
  # Snake + Pac-Man animations, published together to the `output` branch
  games:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#a78bfa&color_dots=#ebedf0,#c7e6ff,#7ddbff,#4fbcff,#a78bfa
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#fef3c7&color_dots=#0e1a30,#1a2a4a,#2f6fa8,#4fbcff,#a78bfa

      - name: Generate Pac-Man
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Collect Pac-Man output
        run: |
          mkdir -p dist
          find . -name '*pacman*.svg' -not -path './dist/*' -exec cp {} dist/ \; || true
          ls -la dist

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Isometric 3D contribution skyline, committed to profile-3d-contrib/
  skyline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A profile-3d-contrib
          git diff --cached --quiet && exit 0
          git commit -m "Update 3D contribution graph - [Skip GitHub Action]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
